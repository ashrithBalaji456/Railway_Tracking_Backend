spring:
  application:
    name: railtracker

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:railtrack_db;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        use_sql_comments: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET:d2FudC10by10cmFjay10cmFpbnMtc2VjdXJlLWtleS0yNTYtYml0LXZhbHVlLXRvLWJlLXJlcGxhY2VkLWluLXByb2R1Y3Rpb24=} # default base64 secret for local testing
    expiration-ms: 86400000 # 24 hours
  railradar:
    api-key: ${RAILRADAR_API_KEY:}
    base-url: ${RAILRADAR_BASE_URL:https://api.railradar.in/v1}
    trust-all-ssl: ${RAILRADAR_TRUST_ALL_SSL:true}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

logging:
  level:
    root: INFO
    com.example.railtracker: DEBUG
    org.springframework.security: INFO

gemini:
  api:
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
    key: ${GEMINI_API_KEY:}



